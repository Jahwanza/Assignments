.grade{display:inline-block;margin-top:14px;background:var(--hi);color:var(--hi-ink);font-weight:600;padding:2px 10px;border-radius:4px}

footer{margin-top:40px;color:var(--muted);font-size:15px;background:var(--paper);display:inline-block}
.frame{width:100%;height:70vh;border:1.5px solid var(--line);border-radius:8px;background:#fff}

<script type="text/plain" class="rmd" data-topic="Hypothesis testing" data-date="Sept 2026" data-grade="A">
---
title: "Two-sample t-test on blood pressure"
output: html_document
---

## Question

Does systolic blood pressure differ between patients on the new drug and patients on placebo?

## Load and summarize the data

```{r}
bp <- read.csv("bp_trial.csv")
aggregate(sbp ~ group, data = bp, FUN = mean)
```

```{output}
    group    sbp
1    drug  121.4
2 placebo  128.4
```

## Test

I used Welch's t-test because I did not want to assume equal variances.

```{r}
t.test(sbp ~ group, data = bp)
```

```{output}
	Welch Two Sample t-test

data:  sbp by group
t = -2.41, df = 17.6, p-value = 0.027
95 percent confidence interval:
 -13.1  -0.9
sample estimates:
   mean in group drug mean in group placebo
                121.4                 128.4
```

## Conclusion

The drug group averaged **7 mmHg lower** (95% CI 0.9 to 13.1, p = 0.027). At the 0.05 level this is evidence of a real difference.
</script>

<script type="text/plain" class="rmd" data-topic="Categorical data" data-date="Oct 2026" data-grade="A-">
---
title: " Smoking and disease (chi-square test)"
output: html_document
---

## Question

Is smoking status associated with disease in this sample of 200 people?

## Build the table

```{r}
tab <- matrix(c(30, 70, 20, 80), nrow = 2, byrow = TRUE,
              dimnames = list(smoker = c("yes", "no"), disease = c("yes", "no")))
tab
```

```{output}
      disease
smoker yes no
   yes  30 70
   no   20 80
```

## Test

```{r}
chisq.test(tab)
```

```{output}
	Pearson's Chi-squared test with Yates' continuity correction

X-squared = 2.16, df = 1, p-value = 0.1416
```

## Conclusion

- Disease rate in smokers: 30%. In non-smokers: 20%.
- The p-value is above 0.05, so we **fail to reject** independence. With only 200 people, the study may be too small to detect a 10 point gap.
</script>

<script>
/* Site settings */
const SITE = { name: "Jahwanza", intro: "My biostatistics assignments written in R Markdown. Open one to read the finished report or see the source." };
/* ===== END EDIT ===== */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function inline(t){
  return esc(t).replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g,"<em>$1</em>");
}
function prose(text){
  const out=[]; let list=[];
  const flush=()=>{ if(list.length){out.push("<ul>"+list.map(i=>"<li>"+inline(i)+"</li>").join("")+"</ul>");list=[];} };
  let para=[]; const flushP=()=>{ if(para.length){out.push("<p>"+inline(para.join(" "))+"</p>");para=[];} };
  for(const line of text.split("\n")){
    let m;
    if((m=line.match(/^(#{1,3})\s+(.*)/))){flush();flushP();out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);}
    else if((m=line.match(/^\s*[-*]\s+(.*)/))){flushP();list.push(m[1]);}
    else if(!line.trim()){flush();flushP();}
    else {flush();para.push(line.trim());}
  }
  flush();flushP();return out.join("");
}
function parse(src){
  src=src.replace(/^\s*\n/,"").replace(/\s+$/,"");
  let title="Untitled", body=src;
  const y=src.match(/^---\n([\s\S]*?)\n---\n?/);
  if(y){ const t=y[1].match(/title:\s*"?([^"\n]+)"?/); if(t) title=t[1].trim(); body=src.slice(y[0].length); }
  return {title, body, src};
}
function renderDoc(body){
  const re=/```\{(\w+)[^}]*\}\n([\s\S]*?)```/g; let html="", last=0, m, prevCode=false;
  while((m=re.exec(body))){
    html+=prose(body.slice(last,m.index)); last=re.lastIndex;
    const code=m[2].replace(/\n$/,"");
    if(m[1]==="output"){ html+=`<pre class="out ${prevCode?"":"alone"}">${esc(code)}</pre>`; prevCode=false; }
    else { html+=`<pre>${esc(code)}</pre>`; prevCode=true; }
    if(m[1]!=="output"){ /* close rounded corners if no output follows */ }
  }
  html+=prose(body.slice(last));
  return html.replace(/<pre>((?:(?!<\/pre>)[\s\S])*)<\/pre>(?!<pre class="out)/g,'<pre class="solo">$1</pre>');
}

const ITEMS=[...document.querySelectorAll("script.rmd, script.qmd")].map((s,i)=>{
  const has=s.textContent.trim().length>0, p=parse(s.textContent);
  return {id:i,title:s.dataset.title||p.title,topic:s.dataset.topic||"Other",date:s.dataset.date||"",grade:s.dataset.grade||"",
    file:s.dataset.file||"",ext:s.dataset.ext||(s.classList.contains("qmd")?"qmd":"Rmd"),has,html:renderDoc(p.body),src:p.src};
});
const topics=["All",...new Set(ITEMS.map(a=>a.topic))];
let current="All";

$("name").textContent=SITE.name+"'s"; $("intro").textContent=SITE.intro;
/*$("footer").textContent="Made by "+SITE.name; document.title=SITE.name+"'s Biostatistics Homework";*/

function views(a){
  const v=[];
  if(a.file) v.push(["Knitted report",`<iframe class="frame" src="${esc(a.file)}" title="${esc(a.title)}" loading="lazy"></iframe><p><a href="${esc(a.file)}" target="_blank" rel="noopener">Open full page</a></p>`]);
  else if(a.has) v.push(["Report",`<div class="doc">${a.html}</div>`]);
  if(a.has) v.push(["."+a.ext+" source",`<pre class="solo">${esc(a.src)}</pre>`]);
  return `<div class="tabs">${v.map((x,i)=>`<button type="button" data-v="${i}" aria-pressed="${i===0}">${x[0]}</button>`).join("")}</div>`+
    v.map((x,i)=>`<div class="view" data-i="${i}" ${i?"hidden":""}>${x[1]}</div>`).join("");
}
function render(){
  const open=new Set([...document.querySelectorAll("details[open]")].map(d=>d.dataset.id));
  $("filters").innerHTML=topics.map(t=>`<button type="button" data-t="${esc(t)}" aria-pressed="${t===current}">${esc(t)}</button>`).join("");
  const shown=ITEMS.filter(a=>current==="All"||a.topic===current);
  $("list").innerHTML=shown.length?shown.map(a=>`
    <details data-id="${a.id}" ${open.has(String(a.id))?"open":""}>
      <summary><h2>${esc(a.title)}</h2><span class="tag">${esc(a.topic)}${a.date?", "+esc(a.date):""}</span></summary>
      <div class="body">
        ${views(a)}
        ${a.grade?`<span class="grade">Grade: ${esc(a.grade)}</span>`:""}
      </div>
    </details>`).join(""):`<p class="empty">No assignments here yet.</p>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.t){current=b.dataset.t;render();return;}
  if(b.dataset.v){
    const box=b.closest(".body");
    box.querySelectorAll(".view").forEach(x=>x.hidden=x.dataset.i!==b.dataset.v);
    box.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  }
});
render();
</script>
